name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── CI: Build & Lint ────────────────────────────────────────────────────────
  ci:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install CGo dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc g++ libwebp-dev libjpeg-dev zlib1g-dev

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=1 go build -o /dev/null ./cmd/main.go

  # ── CD: Deploy on Hetzner (self-hosted runner) ─────────────────────────────
  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Write env file
        env:
          DB_URL: ${{ secrets.DB_URL }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          printf 'PORT=8080\nDB_URL=%s\nPOSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=%s\nJWT_SECRET=%s\nGIN_MODE=release\n' \
            "$DB_URL" "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$POSTGRES_DB" "$JWT_SECRET" \
            > ${{ secrets.APP_DIR }}/.env.docker

      - name: Deploy
        run: |
          cd ${{ secrets.APP_DIR }}
          git pull origin main
          docker compose -f docker-compose.prod.yml up -d --build
          docker image prune -f
