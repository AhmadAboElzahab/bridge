definitions:
  auth.SigninRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  maid.MaidInput:
    properties:
      email:
        type: string
      first_name:
        type: string
    required:
    - email
    - first_name
    type: object
  models.Country:
    properties:
      code:
        type: string
      label:
        type: string
      value:
        type: integer
    type: object
  models.Language:
    properties:
      iso639_3:
        type: string
      label:
        type: string
      value:
        type: integer
    type: object
  models.Maid:
    properties:
      auto_renew:
        type: boolean
      availability:
        type: string
      bio:
        type: string
      care_giver_certificate:
        type: boolean
      created_at:
        type: string
      current_location:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      expected_salary:
        type: number
      first_aid_certificate:
        type: boolean
      first_name:
        type: string
      gender:
        type: string
      id:
        type: integer
      is_email_verified:
        type: boolean
      is_phone_verified:
        type: boolean
      is_profile_visible:
        type: boolean
      languages:
        items:
          $ref: '#/definitions/models.Language'
        type: array
      last_login_at:
        type: string
      last_name:
        type: string
      nationality:
        $ref: '#/definitions/models.Country'
      nationality_id:
        type: integer
      notify_on_interest:
        type: boolean
      notify_on_message:
        type: boolean
      phone_number:
        type: string
      preferred_work_location:
        type: string
      profile_completion_percentage:
        type: integer
      profile_picture:
        type: string
      profile_picture_hash:
        type: string
      religion:
        type: string
      skills:
        items:
          $ref: '#/definitions/models.Skill'
        type: array
      status:
        type: string
      subscription_end_date:
        type: string
      subscription_failed_attempts:
        type: integer
      subscription_last_payment_date:
        type: string
      subscription_payment_gateway_id:
        type: string
      subscription_plan:
        type: string
      subscription_start_date:
        type: string
      subscription_status:
        type: string
      teaching_certificate:
        type: boolean
      updated_at:
        type: string
      video_introduction:
        type: string
      visa_status:
        type: string
      whatsapp_number:
        type: string
      work_preferences:
        type: string
      years_of_experience:
        type: integer
    type: object
  models.Skill:
    properties:
      label:
        type: string
      value:
        type: integer
    type: object
  models.User:
    description: User entity with ID, first name, last name, email, password, date
      of birth, avatar, and blurhash
    properties:
      avatar:
        example: /images/avatar.png
        type: string
      blurhash:
        example: LKO2?V%2Tw=w]~RBVZRi};RPxuwH
        type: string
      created_at:
        type: string
      date_of_birth:
        example: "1990-01-01"
        type: string
      email:
        example: john@example.com
        type: string
      first_name:
        example: John
        type: string
      id:
        example: 1
        type: integer
      last_name:
        example: Doe
        type: string
      updated_at:
        type: string
    type: object
  tabs.CreateTabInput:
    properties:
      model_name:
        type: string
      tab_name:
        type: string
    required:
    - model_name
    - tab_name
    type: object
  tabs.UpdateTabInput:
    properties:
      tab_name:
        type: string
    required:
    - tab_name
    type: object
  user.UserInput:
    properties:
      email:
        type: string
      first_name:
        type: string
    required:
    - email
    - first_name
    type: object
  utils.ErrorResponse:
    properties:
      code:
        description: Optional error code for frontend
        type: string
      details:
        description: Optional detailed explanation
        type: string
      error:
        description: Human-readable error message
        type: string
    type: object
info:
  contact: {}
paths:
  /api/auth/signin:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT token
      parameters:
      - description: Signin request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.SigninRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: User Signin
      tags:
      - Auth
  /api/auth/signup:
    post:
      consumes:
      - multipart/form-data
      description: Registers a new user
      parameters:
      - description: First Name
        in: formData
        name: first_name
        required: true
        type: string
      - description: Last Name
        in: formData
        name: last_name
        type: string
      - description: Email
        format: email
        in: formData
        name: email
        required: true
        type: string
      - description: Password
        in: formData
        name: password
        required: true
        type: string
      - description: Date of Birth
        format: date
        in: formData
        name: date_of_birth
        type: string
      - description: Avatar Image
        in: formData
        name: avatar
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: User Signup
      tags:
      - Auth
  /api/maids:
    post:
      consumes:
      - application/json
      description: Create a new maid with first name and email
      parameters:
      - description: Maid data
        in: body
        name: maid
        required: true
        schema:
          $ref: '#/definitions/maid.MaidInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Maid'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new maid
      tags:
      - maids
  /api/maids/{id}:
    delete:
      description: Delete a maid by ID (soft delete)
      parameters:
      - description: Maid ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a maid
      tags:
      - maids
    get:
      description: Get a single maid using their ID
      parameters:
      - description: Maid ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Maid'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a maid by ID
      tags:
      - maids
    put:
      consumes:
      - application/json
      description: Update maid information by ID
      parameters:
      - description: Maid ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated maid data
        in: body
        name: maid
        required: true
        schema:
          $ref: '#/definitions/maid.MaidInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Maid'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a maid
      tags:
      - maids
  /api/maids/index:
    post:
      consumes:
      - application/json
      description: Query maids with advanced filtering, search, and pagination
      parameters:
      - description: Filter and pagination payload (TabPayload)
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  type: object
                type: array
              meta:
                properties:
                  totalRowCount:
                    format: int64
                    type: integer
                type: object
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List maids with filters
      tags:
      - maids
  /api/tabs:
    get:
      description: Returns form field metadata and the authenticated user's tab configurations
        for a given model
      parameters:
      - description: Model name (e.g. Maid)
        in: query
        name: model
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              form_fields:
                items:
                  type: object
                type: array
              tabs:
                items:
                  type: object
                type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get form fields and user tabs
      tags:
      - tabs
    post:
      consumes:
      - application/json
      description: Creates a new table view tab for the authenticated user
      parameters:
      - description: Tab creation data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tabs.CreateTabInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              message:
                type: string
              tab_id:
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new tab
      tags:
      - tabs
  /api/tabs/{id}:
    delete:
      description: Deletes a user's tab and all its column configurations
      parameters:
      - description: Tab ID
        in: path
        name: id
        required: true
        type: integer
      produces:
